<div class="dashboard-container">
  <!-- Header -->
  <app-header 
    (logoutClicked)="onLogoutClick()">
  </app-header>

  <!-- Main Dashboard -->
  <div class="main-content">
    <div class="dashboard-grid">
      
      <!-- LEFT COLUMN - Recommendations & History -->
      <div class="left-column">
        <app-recommendations 
          (recommendationSelected)="onRecommendationSelected($event)">
        </app-recommendations>
      </div>

      <!-- CENTER COLUMN - Search & Generation -->
      <div class="center-column">
        <app-search 
          [selectedIngredients]="selectedIngredients">
        </app-search>
      </div>

      <!-- RIGHT COLUMN - Empty for now, can be used for additional features -->
      <div class="right-column">
      </div>

    </div>
  </div>
</div>
