<header class="header">
  <div class="header-content">
    <div class="logo-section">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
          <line x1="6" y1="17" x2="18" y2="17" />
        </svg>
      </div>
      <h1 class="logo-text">QuickChef</h1>
    </div>
    <div class="header-actions">
      <button class="btn-profile" (click)="onSavedClick()">Favorites</button>
      <button class="btn-profile" (click)="onProfileClick()">Profile</button>
      <button class="btn-logout" (click)="onLogoutClick()">Logout</button>
    </div>
  </div>
</header>
